<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-contact-page>
<h1 class="title" data-contact-heading></h1>
<form class="" data-contact-form action="" method="post" enctype="text/plain">
    <table>
        <tr>
            <td><label data-contact-name-label></label></td>
            <td><input type="text" name="yourName" value=""></td>
        </tr>
        <tr>
            <td><label data-contact-email-label></label></td>
            <td><input type="email" name="yourEmail" value=""></td>
        </tr>
        <tr>
            <td><label data-contact-message-label></label></td>
            <td><textarea name="yourMessage" rows="10" cols="80"></textarea></td>
        </tr>
    </table>
    <input data-contact-submit type="submit">
</form>
<p><em data-contact-thank-you></em></p>

<script src="render-content.js"></script>

</body>
</html>
